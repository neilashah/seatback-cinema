name: Sync catalog membership

# Runs daily, fully in CI: scrapes the Letterboxd list (via ScraperAPI --
# see lb_detail_scrape.py's docstring for why a plain request can't do this
# directly, Letterboxd sits behind a Cloudflare Managed Challenge), matches
# every title against TMDB (sync_catalog.py, overrides.csv applies first),
# and splits the result: titles that matched cleanly (auto/override tier)
# are committed straight to main, which then triggers refresh-catalog.yml
# so catalog.json and the live site pick up the new titles with no human
# step at all for the common case. Titles the matcher wasn't confident
# about (review/fuzzy/miss tier) are held *out* of the catalog and surfaced
# as a catalog-needs-review GitHub issue instead, so a bad guess can't ship
# unreviewed -- see sync_catalog.py's docstring for the exact split logic.
# The same held-back titles also land in pipeline/flagged.json (structured,
# machine-readable) for the Catalog Ops dashboard's "Needs your review"
# section to pick up. When titles_with_years.tsv/matched.csv themselves
# actually change (a real membership change, not just scrape/flag noise),
# root-level last-updated.json also gets a fresh timestamp -- that's what
# drives the app's "last updated" indicator.
#
# This used to be two stages in two different places: a local script
# (push_scrape.sh, scheduled via launchd) did the scrape because Letterboxd
# blocks GitHub Actions runner IPs directly with a 403, and its push
# triggered this workflow to do everything else. That's gone: ScraperAPI's
# infrastructure is what actually reaches Letterboxd now, not this
# runner's IP, so the scrape can happen right here. Simpler, and no longer
# depends on a laptop being on. See DEPLOY.md SS5 for the full history.

on:
  schedule:
    # Mon/Wed/Fri, ~9am Eastern. Actions cron is always UTC and ignores DST,
    # so this is pinned to EDT (UTC-4): 13:00 UTC. During EST (roughly early
    # Nov - mid March) that lands at 8am Eastern instead -- shift to
    # '0 14 * * 1,3,5' for that stretch if exact local time matters.
    #
    # This used to run daily. It doesn't because the scrape costs real
    # money: each page is a ScraperAPI JS-render request billed at 10
    # credits against a 1,000-credit/month free tier, so daily runs came to
    # ~91% of the allowance (see lb_detail_scrape.py's CREDIT COST section).
    # Three runs a week is ~260 credits/month with room for manual
    # dispatches, and the list itself changes far more slowly than daily --
    # membership went unchanged for the nine straight syncs before this
    # change landed. Use workflow_dispatch when you know Em just updated it.
    - cron: '0 13 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write   # needed to trigger refresh-catalog.yml via workflow_dispatch

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Scrape Letterboxd list
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python3 lb_detail_scrape.py > pipeline/raw_scrape.tsv

      - name: Sanity-check the scrape
        run: |
          n=$(wc -l < pipeline/raw_scrape.tsv | tr -d ' ')
          echo "scraped $n titles"
          if [ "$n" -lt 100 ]; then
            echo "::error::Scrape returned only $n titles (expected ~189+) -- looks broken, aborting"
            exit 1
          fi
          if [ -f titles_with_years.tsv ]; then
            prev=$(wc -l < titles_with_years.tsv | tr -d ' ')
            threshold=$(( prev * 80 / 100 ))
            if [ "$prev" -gt 0 ] && [ "$n" -lt "$threshold" ]; then
              echo "::error::Scrape returned $n titles, down from $prev (>20% drop) -- looks like a partial/broken scrape, aborting"
              exit 1
            fi
          fi

      - name: Run sync
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: python3 sync_catalog.py

      - name: Ensure labels exist
        run: |
          gh label create catalog-needs-review --color 0E8A16 \
            --description "Titles held back from the catalog pending a human match decision" --force
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit clean-tier titles
        id: commit
        run: |
          git add pipeline/raw_scrape.tsv titles_with_years.tsv pipeline/matched.csv pipeline/flagged.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # last-updated.json drives the app's "last updated" indicator, and
          # is meant to answer one specific question for a passenger: has
          # the movie list itself changed, not just scores or scrape noise.
          # A plain `git diff` of matched.csv can't answer that -- its
          # `popularity` column comes from TMDB and is rewritten daily, so
          # that check fired on every single run. membership_changed.py
          # compares only the columns that decide what ships (see its
          # docstring); exit 0 means a real change, 1 means noise only.
          if python3 pipeline/membership_changed.py; then
            echo "{\"titlesUpdatedAt\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > last-updated.json
            git add last-updated.json
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync catalog membership ($(date -u +%Y-%m-%d))"
          # Defensive: a concurrent push (e.g. someone committing by hand,
          # or refresh-catalog.yml landing mid-run) would otherwise reject
          # this push outright.
          git pull --rebase origin main
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger score refresh
        if: steps.commit.outputs.committed == 'true'
        run: gh workflow run refresh-catalog.yml
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update review issue
        run: |
          existing=$(gh issue list --label catalog-needs-review --state open \
            --json number --jq '.[0].number // empty')
          if [ -s flagged.txt ]; then
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file flagged.txt
              echo "Updated issue #$existing."
            else
              gh issue create --title "Titles need a match decision" \
                --label catalog-needs-review --body-file flagged.txt
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "All titles resolved cleanly this sync — nothing left to review."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
