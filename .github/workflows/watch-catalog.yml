name: Watch Letterboxd list for changes

# Cheap daily check for whether Delta's Letterboxd list has changed since
# the committed titles_with_years.tsv (the file the matching pipeline was
# last run against). Unlike refresh-catalog.yml, this makes NO calls to
# TMDB/MDBList/Trakt and commits nothing — it only scrapes the one
# Letterboxd list and diffs title sets, so it's cheap enough to run daily.
#
# On a detected change, triggers sync-catalog.yml to actually re-run the
# matching pipeline and commit whatever resolves cleanly — see that
# workflow and sync_catalog.py for what happens next; a human is only
# needed if something ends up flagged for review there. If the scrape
# itself looks broken (far fewer titles than expected — a 403 or markup
# shift), that's reported separately as a `catalog-watch-broken` issue so
# it isn't mistaken for a real catalog change.

on:
  schedule:
    - cron: '0 13 * * *'   # daily, 13:00 UTC (~9am EDT / 8am EST)
  workflow_dispatch:

permissions:
  issues: write
  actions: write   # needed to trigger sync-catalog.yml via workflow_dispatch

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Ensure labels exist
        run: |
          gh label create catalog-watch-broken --color D93F0B \
            --description "watch-catalog.yml scrape looks broken" --force
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Scrape and diff
        id: watch
        run: |
          set +e
          python3 watch_catalog.py > watch-output.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat watch-output.txt

      - name: Trigger membership sync on drift
        if: steps.watch.outputs.code == '1'
        run: gh workflow run sync-catalog.yml
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Open issue on scrape failure
        if: steps.watch.outputs.code == '2'
        run: |
          existing=$(gh issue list --label catalog-watch-broken --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Issue #$existing already open — not creating a duplicate."
            exit 0
          fi
          gh issue create \
            --title "watch-catalog.yml scrape looks broken" \
            --label catalog-watch-broken \
            --body-file watch-output.txt
        env:
          GH_TOKEN: ${{ github.token }}
